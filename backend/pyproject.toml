[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# JWT_SECRET is set before the app modules are imported
"tests/conftest.py" = ["E402"]
# FastAPI's dependency injection idiom: Depends()/Query() in argument defaults
"{api,auth}/*.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["api", "auth", "catalog", "collection", "config", "database", "main", "rate_limit", "scripts", "user"]
